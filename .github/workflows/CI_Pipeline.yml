name: CI_Pieline

on:
  push:
    branches: 
      - "*"
  workflow_dispatch:


jobs:

  checkout:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6.1.0
       
  build:
    needs: checkout
    runs-on: ubuntu-latest
    
    steps:
      - name: checkuot code
        uses: actions/checkout@v6.1.0
        
      - name: Build Docker image
        run: |
          docker build . -t abobakryousre/first-app

        
  UnitTest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Unit Test
        run: echo  "running unit test"
        
  IntegratTest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Unit Test
        run: echo  "Integration test"
        
  E2ETest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Unit Test
        run: echo  "E2E test"
        
  Release:
    needs: 
      - E2ETest
      - IntegratTest
      - UnitTest
    runs-on: ubuntu-latest
    steps:
      - name: checkuot code
        uses: actions/checkout@v6.1.0
        
      - name: Build Docker image
        run: docker build . -t abobakryousre/first-app
      - name: Release
        run: |
          echo ${{ secrets.DOCKERPASSWORD }} | docker login -u abobakryousre@gmail.com --password-stdin
          docker push abobakryousre/first-app
