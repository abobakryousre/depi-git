name: CI

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:

  CheckoutCode:
    runs-on: ubuntu-latest

    steps:
    - name: chekcout code
      uses: actions/checkout@v4
      
    - name: list code
      run: ls -l
  DockerLogin:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Docker 
        uses: docker/setup-docker-action@v5.5.0
      - name: Login to docker
        run: |
          echo '${{ secrets.dockerPassword }} | docker login -u ${{ secrets.dockerUser }} --password-stdin'
          docker build . -t abobakryousre/first-app
          docker push abobakryousre/first-app
